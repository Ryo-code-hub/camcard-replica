name: CamCardReplica
options:
  bundleIdPrefix: com.ryocode
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
packages:
  CardCore:
    path: Core
targets:
  CamCardReplica:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryocode.camcardreplica
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    dependencies:
      - package: CardCore
        product: CardCore
  CamCardReplicaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AppTests
    dependencies:
      - target: CamCardReplica
      - package: CardCore
        product: CardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryocode.camcardreplica.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  CamCardReplica:
    build:
      targets:
        CamCardReplica: all
        CamCardReplicaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - CamCardReplicaTests
    archive:
      config: Release
